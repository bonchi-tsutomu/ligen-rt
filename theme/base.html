<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}{%endblock title%} - {{site_title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            margin-bottom: 120px;
        }

        header {
            height: 65px;
            width: 100%;
            top: 0;
            left: 0;
            background-color: #0d1b5e;
            display: flex;
            margin: 0;
            padding-top: 0;
            padding-bottom: 0;
            padding-right: 0;
            padding-left: 20px;
            color: white;
            align-items: center;
            justify-items: center;
            box-shadow: 0px -3px 10px 3px black; 
        }

        footer {
            position: fixed;
            height: 30px;
            width: 100%;
            bottom: 0;
            left: 0;
            background-color: silver;
            display: flex;
            margin: 0;
            padding-top: 0;
            padding-bottom: 0;
            padding-right: 0;
            padding-left: 20px;
            color: grey;
            align-items: center;
            justify-items: center;
        }

        main {
            padding-left: 25px;
            padding-right: 25px;
        }

        .site-icon {
            height: 58px;
            margin-right: 5px;
            width: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{site_title}}</h1>
    </header>
    <main>
        {% block main %}
        {% endblock main %}
    </main>
    <footer>
        <p>{{site_title}} &nbsp;|&nbsp; Powered By LigenRT</p>
    </footer>
</body>
</html>
